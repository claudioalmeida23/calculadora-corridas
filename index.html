<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>No Caminho Certo</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#06b6d4">

<meta http-equiv="Content-Security-Policy" content="
default-src 'self';
script-src 'self' https://unpkg.com;
style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com;
font-src https://fonts.gstatic.com;
img-src 'self' data: https:;
connect-src https://nominatim.openstreetmap.org https://router.project-osrm.org;
">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
integrity="sha256-sA+4w1rj7kGEXLMaLLfi5yRvD/4CqpGYGAaHo9d2kLk="
crossorigin=""/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{
--primary:#06b6d4;
--bg:#050505;
--card:#111;
--border:#262626;
--text:#f8fafc;
--success:#10b981;
--text-dim:#94a3b8;
}

*{box-sizing: border-box;}

body{
background:var(--bg);
color:var(--text);
font-family:'Inter',sans-serif;
max-width:500px;
margin:auto;
padding:15px;
}

h2{text-align:center;color:var(--primary); font-weight: 700; margin: 10px 0 20px;}

.card{
background:var(--card);
border:1px solid var(--border);
border-radius:20px;
padding:20px;
margin-bottom:15px;
box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

label{
display: block;
font-size: 11px;
color: var(--text-dim);
text-transform: uppercase;
font-weight: 700;
margin-bottom: 6px;
margin-left: 4px;
}

.input-group{position:relative;margin-bottom:12px;}

input{
width:100%;
padding:14px 16px;
background:#1a1a1a;
border:1px solid var(--border);
border-radius:14px;
color:#fff;
font-size: 15px;
transition: border 0.3s;
}

input:focus{border-color: var(--primary); outline: none;}
input[readonly]{background: #0a0a0a; color: var(--primary); font-weight: 600; border-style: dashed;}

.actions{
position:absolute;
right:8px;
top:50%;
transform:translateY(-50%);
display:flex;
gap:6px;
}

.icon-btn{
width:36px;height:36px;border:1px solid #333;border-radius:10px;
background:#262626;color:var(--primary);cursor:pointer;
display: flex; align-items: center; justify-content: center;
transition: 0.2s;
}
.icon-btn:active{background: var(--primary); color: #000;}

.grid{display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px;}

button{
width:100%;padding:16px;border:none;border-radius:14px;
font-weight:bold;cursor:pointer; font-size: 14px;
transition: transform 0.2s;
}
button:active{transform: scale(0.98);}

.primary{background:var(--primary);color:#000; margin-top: 5px;}
.success{background:var(--success);color:#fff; margin-top: 10px;}

#map{height:240px; border-radius:18px; border: 1px solid var(--border); margin: 5px 0 15px;}

.result{
margin-top:15px;padding:18px;border-radius:15px;
background: rgba(6, 182, 212, 0.05);
border:1px solid var(--primary);display:none;text-align:center;
}

.res-lucro { font-size: 24px; color: var(--success); display: block; margin-top: 5px; }

footer{
text-align:center;
font-size:11px;
color:#555;
margin-top:40px;
padding: 20px;
border-top: 1px solid #111;
}
</style>
</head>

<body>

<h2>🚖 No Caminho Certo</h2>

<div class="card">
<label>Definir Rota</label>
<div class="input-group">
<input id="origem" placeholder="Partida">
<div class="actions">
<button class="icon-btn" id="gps">📍</button>
<button class="icon-btn" id="vozO">🎤</button>
</div>
</div>

<div class="input-group">
<input id="destino" placeholder="Destino">
<div class="actions">
<button class="icon-btn" id="vozD">🎤</button>
</div>
</div>

<button class="primary" id="rota">BUSCAR ROTA</button>
</div>

<div id="map"></div>

<div class="card">
<label>Informações da Viagem</label>
<div class="grid">
    <div><input id="km" readonly placeholder="KM"></div>
    <div><input id="tempo" readonly placeholder="Minutos"></div>
</div>

<label>Custos e Preço</label>
<div class="grid">
    <div><input id="media" type="number" placeholder="KM/L"></div>
    <div><input id="gasolina" type="number" placeholder="Gasolina R$"></div>
</div>

<input id="cobrar" type="number" placeholder="Valor que será cobrado (R$)" style="margin-bottom: 5px;">

<button class="success" id="calc">CALCULAR LUCRO</button>

<div id="res" class="result"></div>
</div>

<footer>
<strong>Claudio Almeida.CAAS</strong><br><br>

🔧 Tecnologias utilizadas:<br><br>
OpenStreetMap • OSRM • Nominatim<br>
Leaflet.js • Web Speech API • PWA<br><br>

<small>© OpenStreetMap contributors</small>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
integrity="sha256-o9N1j8Mk8tP4xkS8Wc58SUaYG3PaY5E9O+V1YQuV6kM="
crossorigin=""></script>

<script>
"use strict";

const $ = id => document.getElementById(id);

const map = L.map('map', {zoomControl: false}).setView([-23.55,-46.63],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let rotaLayer = null;

// VOZ
function speech(input){
const API = window.SpeechRecognition || window.webkitSpeechRecognition;
if(!API) return alert("Sem suporte a voz");

const rec = new API();
rec.lang = "pt-BR";
rec.onresult = e => input.value = e.results.transcript;
rec.start();
}

$("vozO").onclick = () => speech($("origem"));
$("vozD").onclick = () => speech($("destino"));

// GPS
$("gps").onclick = () => {
navigator.geolocation.getCurrentPosition(pos=>{
const {latitude, longitude} = pos.coords;

$("origem").value = "Minha localização";
$("origem").dataset.lat = latitude;
$("origem").dataset.lon = longitude;

map.setView([latitude, longitude], 15);
L.marker([latitude, longitude]).addTo(map);
});
};

// GEOCODE
async function geocode(q, input){
if(q === "Minha localização"){
return {lat:input.dataset.lat, lon:input.dataset.lon};
}

const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
const data = await res.json();

return data.length ? {lat:data.lat, lon:data.lon} : null;
}

// ROTA
$("rota").onclick = async ()=>{
const a = await geocode($("origem").value, $("origem"));
const b = await geocode($("destino").value, $("destino"));

if(!a || !b) return alert("Endereço inválido");

const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`);
const d = await r.json();

const route = d.routes;

$("km").value = (route.distance/1000).toFixed(2);
$("tempo").value = Math.round(route.duration/60);

if(rotaLayer) map.removeLayer(rotaLayer);

rotaLayer = L.geoJSON(route.geometry,{style:{color:"#06b6d4", weight: 6}}).addTo(map);
map.fitBounds(rotaLayer.getBounds(),{padding:});
};

// CALCULO
$("calc").onclick = ()=>{
const km = parseFloat($("km").value);
const media = parseFloat($("media").value);
const gasolina = parseFloat($("gasolina").value);
const cobrar = parseFloat($("cobrar").value);

if([km,media,gasolina,cobrar].some(isNaN)) return alert("Preencha tudo");

const custo = (km/media)*gasolina;
const lucro = cobrar - custo;

const res = $("res");
res.style.display = "block";
res.innerHTML = `<span style="color:#94a3b8; font-size:12px;">GASTO: R$ ${custo.toFixed(2)}</span><br><label style="margin-top:10px">LUCRO LÍQUIDO</label><strong class="res-lucro">R$ ${lucro.toFixed(2)}</strong>`;
};

// PWA
if("serviceWorker" in navigator){
window.addEventListener("load", ()=>{
navigator.serviceWorker.register("sw.js")
.then(()=>console.log("PWA ativo"))
.catch(()=>console.log("Erro PWA"));
});
}
</script>

</body>
</html>
