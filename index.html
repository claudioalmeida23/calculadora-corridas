<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>No Caminho Certo — </title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <style>
        :root { --primary: #06b6d4; --bg: #000; --card-bg: #0b0b0b; --text: #fff; --border: #222; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; max-width: 720px; margin: 12px auto; padding: 16px; box-sizing: border-box; }
        *, *::before, *::after { box-sizing: border-box; }
        h2 { text-align: center; color: var(--primary); margin-bottom: 5px; }
        .small { font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 15px; }
        label { display: block; margin-top: 12px; color: #cbd5e1; font-size: 0.9rem; }
        input { width: 100%; padding: 12px; margin-top: 6px; background: var(--card-bg); color: #fff; border: 1px solid var(--border); border-radius: 8px; }
        .input-voice-container { position: relative; }
        .btn-group-input { position: absolute; right: 8px; top: 12px; display: flex; gap: 5px; }
        .icon-btn { background: #222; width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #333; }
        .icon-btn.active { background: var(--primary); color: #000; }
        button { width: 100%; margin-top: 10px; padding: 14px; font-weight: bold; border-radius: 8px; border: 0; cursor: pointer; }
        .btn-primary { background: var(--primary); color: #001; }
        .btn-ghost { background: #1f2937; color: #fff; }
        .btn-whatsapp { background: #25d366; color: #fff; margin-top: 10px; display: none; }
        .row { display: flex; gap: 10px; }
        .col { flex: 1; }
        #map { height: 250px; margin-top: 16px; border-radius: 12px; border: 1px solid #111; }
        .result-box { margin-top: 16px; background: #06161a; padding: 16px; border-radius: 10px; border-left: 4px solid var(--primary); line-height: 1.6; }
        .history-box { margin-top: 25px; border-top: 1px solid #333; padding-top: 15px; }
        .history-item { background: #111; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.85rem; display: flex; justify-content: space-between; }
        .kv { color: #86efac; font-weight: 700; }
        footer { margin-top: 30px; text-align: center; font-size: 11px; color: #64748b; }
    </style>
</head>
<body>

    <h2>🚖 No Caminho Certo</h2>
    <div class="small">Calculadora</div>

    <label>Origem</label>
    <div class="input-voice-container">
        <input type="text" id="origem" placeholder="Local de partida">
        <div class="btn-group-input">
            <div class="icon-btn" id="gpsOrigem">📍</div>
            <div class="icon-btn" id="micOrigem">🎤</div>
        </div>
    </div>

    <label>Destino</label>
    <div class="input-voice-container">
        <input type="text" id="destino" placeholder="Destino final">
        <div class="btn-group-input"><div class="icon-btn" id="micDestino">🎤</div></div>
    </div>

    <div class="row">
        <div class="col"><button id="btnRoute" class="btn-primary">Calcular Rota</button></div>
        <div class="col"><button id="btnClear" class="btn-ghost">Limpar</button></div>
    </div>

    <div id="map"></div>

    <div class="row">
        <div class="col">
            <label>Distância (KM)</label>
            <input type="number" id="km" readonly>
        </div>
        <div class="col">
            <label>Tempo Est. (Min)</label>
            <input type="number" id="tempo_min" readonly>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <label>Consumo (KM/L)</label>
            <input type="number" id="media" step="0.1">
        </div>
        <div class="col">
            <label>Preço Litro (R$)</label>
            <input type="number" id="gasolina" step="0.01">
        </div>
    </div>

    <label>Valor da Corrida (R$)</label>
    <input type="number" id="cobrar" step="0.01">

    <button id="btnCalc" class="btn-primary" style="background:#10b981;">💰 Calcular e Salvar</button>
    
    <div id="resultado" class="result-box" style="display:none"></div>
    <button id="btnZap" class="btn-whatsapp">📱 Enviar Orçamento via WhatsApp</button>

    <div class="history-box">
        <h4>🕒 Últimas Corridas (Hoje)</h4>
        <div id="listaHistorico"></div>
        <button id="btnLimparHistorico" class="btn-ghost" style="font-size: 11px; padding: 5px;">Apagar Histórico</button>
    </div>

    <footer>Criado por Claudio Almeida • <span id="ano"></span></footer>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        const inputs = ['origem', 'destino', 'km', 'media', 'gasolina', 'cobrar', 'tempo_min'].reduce((acc, id) => ({...acc, [id]: document.getElementById(id)}), {});
        const map = L.map('map').setView([-23.5505, -46.6333], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        let routeLayer = null, markers = [];

        window.onload = () => {
            inputs.media.value = localStorage.getItem('media') || '';
            inputs.gasolina.value = localStorage.getItem('gasolina') || '';
            document.getElementById("ano").textContent = new Date().getFullYear();
            atualizarInterfaceHistorico();
        };

        // --- GPS E VOZ ---
        document.getElementById('gpsOrigem').onclick = () => {
            navigator.geolocation.getCurrentPosition(p => {
                inputs.origem.value = "Minha Localização";
                inputs.origem.dataset.lat = p.coords.latitude;
                inputs.origem.dataset.lon = p.coords.longitude;
            });
        };

        function iniciarVoz(btn, inp) {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = "pt-BR";
            rec.onstart = () => btn.classList.add('active');
            rec.onend = () => btn.classList.remove('active');
            rec.onresult = (e) => inp.value = e.results[0][0].transcript;
            rec.start();
        }
        document.getElementById('micOrigem').onclick = () => iniciarVoz(document.getElementById('micOrigem'), inputs.origem);
        document.getElementById('micDestino').onclick = () => iniciarVoz(document.getElementById('micDestino'), inputs.destino);

        // --- ROTA ---
        btnRoute.onclick = async () => {
            const geocode = async (q) => {
                if(q === "Minha Localização") return { lat: inputs.origem.dataset.lat, lon: inputs.origem.dataset.lon };
                const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
                const j = await r.json(); return j[0] ? {lat: j[0].lat, lon: j[0].lon} : null;
            };
            const a = await geocode(inputs.origem.value);
            const b = await geocode(inputs.destino.value);
            if(!a || !b) return alert("Endereço não encontrado");

            const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`);
            const data = await res.json();
            const route = data.routes[0];

            inputs.km.value = ((route.distance / 1000) * 2).toFixed(2);
            inputs.tempo_min.value = Math.round((route.duration / 60) * 2);

            if(routeLayer) map.removeLayer(routeLayer);
            markers.forEach(m => map.removeLayer(m));
            routeLayer = L.geoJSON(route.geometry, {style: {color: '#06b6d4', weight: 5}}).addTo(map);
            markers = [L.marker([a.lat, a.lon]).addTo(map), L.marker([b.lat, b.lon]).addTo(map)];
            map.fitBounds(routeLayer.getBounds());
        };

        // --- CÁLCULO E HISTÓRICO ---
        document.getElementById('btnCalc').onclick = () => {
            const km = +inputs.km.value, med = +inputs.media.value, gas = +inputs.gasolina.value, cob = +inputs.cobrar.value;
            if(!km || !med || !gas || !cob) return alert("Preencha tudo!");

            localStorage.setItem('media', med);
            localStorage.setItem('gasolina', gas);

            const custo = (km / med) * gas;
            const manut = km * 0.20;
            const lucro = cob - (custo + manut);

            document.getElementById('resultado').style.display = 'block';
            document.getElementById('resultado').innerHTML = `
                <b>Resumo:</b><br> Combustível: <span class="kv">R$ ${custo.toFixed(2)}</span><br>
                Manutenção: <span class="kv">R$ ${manut.toFixed(2)}</span><br>
                <b>LUCRO REAL: <span class="kv" style="font-size:1.2rem">R$ ${lucro.toFixed(2)}</span></b>
            `;

            const btnZap = document.getElementById('btnZap');
            btnZap.style.display = 'block';
            btnZap.onclick = () => {
                const txt = `*Orçamento de Corrida*%0A📍 De: ${inputs.origem.value}%0A🏁 Para: ${inputs.destino.value}%0A📏 Distância: ${km}km%0A⏱️ Tempo: ${inputs.tempo_min.value} min%0A💰 *Valor: R$ ${cob.toFixed(2)}*`;
                window.open(`https://wa.me/?text=${txt}`);
            };

            salvarNoHistorico(inputs.destino.value, lucro);
        };

        function salvarNoHistorico(dest, lucro) {
            let hist = JSON.parse(localStorage.getItem('historico') || '[]');
            hist.unshift({ dest, lucro, hora: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            localStorage.setItem('historico', JSON.stringify(hist.slice(0, 5))); // Guarda as últimas 5
            atualizarInterfaceHistorico();
        }

        function atualizarInterfaceHistorico() {
            const lista = document.getElementById('listaHistorico');
            const hist = JSON.parse(localStorage.getItem('historico') || '[]');
            lista.innerHTML = hist.map(i => `
                <div class="history-item">
                    <span>${i.hora} - ${i.dest.substring(0,20)}...</span>
                    <span class="kv">R$ ${i.lucro.toFixed(2)}</span>
                </div>
            `).join('') || '<p style="font-size:11px">Nenhuma corrida hoje.</p>';
        }

        document.getElementById('btnLimparHistorico').onclick = () => { localStorage.removeItem('historico'); atualizarInterfaceHistorico(); };
        document.getElementById('btnClear').onclick = () => location.reload();
    </script>
</body>
</html>
